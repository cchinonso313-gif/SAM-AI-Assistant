version: '3.8'

services:
  sam-backend:
    build: .
    container_name: sam-ai-backend
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DEBUG_MODE=False
      - VOICE_ENABLED=True
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - sam-network

  prometheus:
    image: prom/prometheus:latest
    container_name: sam-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - sam-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: sam-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - sam-network
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:

networks:
  sam-network:
    driver: bridge
